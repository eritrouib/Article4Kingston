# Refreshes the tool's saved copy of Kingston's official Article 4 boundaries
# from planning.data.gov.uk. Runs on the 1st of every month, and on demand:
# GitHub → Actions → "Update offline Article 4 data" → Run workflow.
name: Update offline Article 4 data

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download official boundaries
        run: python scripts/update_offline_data.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data js/data.js; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data js/data.js
          git commit -m "Update offline Article 4 data from planning.data.gov.uk"
          git push
